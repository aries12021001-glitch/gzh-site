name: 采集热点选题

on:
  schedule:
    - cron: "17 */3 * * *"   # 每 3 小时一次（UTC 时间，避开整点高峰）
  workflow_dispatch:          # 也可以在 Actions 页面手动点「Run workflow」

permissions:
  contents: write             # 只用来把 topics.json 提交回本仓库

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 采集
        run: python scripts/collect.py
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics.json data/state.json
          git diff --cached --quiet || git commit -m "更新热点选题数据"
          git pull --rebase --autostash
          git push
